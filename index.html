                <script>
                    // ==================================================
                    // 1. INICIALIZAR MAPA
                    // ==================================================

                    const limitesMexico = L.latLngBounds(
                        [14.0, -118.5],
                        [33.5, -86.0]
                    );

                    const mapa = L.map("mapa", {
                        center: [23.6345, -102.5528],
                        zoom: 5,
                        minZoom: 4,
                        maxZoom: 18,
                        maxBounds: limitesMexico,
                        maxBoundsViscosity: 1.0
                    });

                    const mapaBase = L.tileLayer(
                        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                        {
                            attribution: "&copy; OpenStreetMap contributors",
                            maxZoom: 18
                        }
                    ).addTo(mapa);

                    mapa.fitBounds(limitesMexico);


                    // ==================================================
                    // 2. FUNCIÓN PARA MOSTRAR ATRIBUTOS
                    // ==================================================

                    function mostrarAtributos(feature, layer) {
                        const propiedades = feature.properties || {};

                        const contenido = document.createElement("div");
                        const titulo = document.createElement("strong");

                        titulo.textContent =
                            propiedades.nombre || "INFORMACIÓN TÉCNICA";

                        contenido.appendChild(titulo);

                        Object.entries(propiedades).forEach(([clave, valor]) => {
                            const fila = document.createElement("div");
                            const etiqueta = document.createElement("b");
                            const dato = document.createElement("span");

                            etiqueta.textContent = clave + ": ";
                            dato.textContent =
                                valor == null ? "Sin dato" : String(valor);

                            fila.append(etiqueta, dato);
                            contenido.appendChild(fila);
                        });

                        layer.bindPopup(contenido);
                    }


                    // ==================================================
                    // 3. CREAR LAS TRES CAPAS VACÍAS CON SUS ESTILOS
                    // ==================================================

                    // PERIMETRALES: contorno rojo
                    const capaZonas = L.geoJSON(null, {
                        style: {
                            color: "#F52727",
                            weight: 2,
                            fillColor: "#CF8B55",
                            fillOpacity: 0.15
                        },
                        onEachFeature: mostrarAtributos
                    });

                    // AFECTACIONES: naranja
                    const capaAfectaciones = L.geoJSON(null, {
                        style: {
                            color: "#ED700E",
                            weight: 2,
                            fillColor: "#CF8B55",
                            fillOpacity: 0.6
                        },
                        pointToLayer: (feature, latlng) =>
                            L.circleMarker(latlng, {
                                radius: 6,
                                color: "#ED700E",
                                fillColor: "#CF8B55",
                                fillOpacity: 0.8,
                                weight: 2
                            }),
                        onEachFeature: mostrarAtributos
                    });
                    

                    // DERECHOS DE VÍA: azul-violeta
                    const capaRutas = L.geoJSON(null, {
                        style: {
                            color: "#5427F5",
                            weight: 3,
                            opacity: 1
                        },
                        pointToLayer: (feature, latlng) =>
                            L.circleMarker(latlng, {
                                radius: 5,
                                color: "#5427F5",
                                fillColor: "#8B7AF5",
                                fillOpacity: 0.9
                            }),
                        onEachFeature: mostrarAtributos
                    });
                    


                    // ==================================================
                    // 4. PANEL DE CAPAS
                    // ==================================================

                    const capas = {
                        "PERIMETRALES": capaZonas,
                        "DERECHO DE VÍA": capaRutas,
                        "AFECTACIONES": capaAfectaciones
                    };

                    L.control.layers(
                        null, 
                        capas,
                        {
                            collapsed: false,
                            position: "topright"
                        }
                    ).addTo(mapa);


                    // ==================================================
                    // 5. CARGAR LOS GEOJSON EXTERNOS
                    // ==================================================

                    async function cargarGeoJSON(url, capa) {
                        const respuesta = await fetch(url);

                        if (!respuesta.ok) {
                            throw new Error(
                                `Error HTTP ${respuesta.status}: ${url}`
                            );
                        }

                        const datos = await respuesta.json();
                        capa.addData(datos);
                    }

                    async function iniciarCapas() {
                        const archivos = [
                            {
                                nombre: "PERIMETRALES",
                                url: "./PERIMETRALES_COMPILADO.geojson",
                                capa: capaZonas
                            },
                            {
                                nombre: "AFECTACIONES",
                                url: "./AFECTACIONES_COMPILADO.geojson",
                                capa: capaAfectaciones
                            },
                            {
                                nombre: "DERECHO DE VÍA",
                                url: "./DDV_COMPILATORIO.geojson",
                                capa: capaRutas
                            }
                        ];

                        const resultados = await Promise.allSettled(
                            archivos.map(item =>
                                cargarGeoJSON(item.url, item.capa)
                            )
                        );

                        resultados.forEach((resultado, i) => {
                            if (resultado.status === "rejected") {
                                console.error(
                                    `Error en ${archivos[i].nombre}:`,
                                    resultado.reason
                                );
                            }
                        });

                        // Ajustar el mapa a los datos cargados
                        const grupo = L.featureGroup(
                            archivos
                                .filter((item, i) =>
                                    resultados[i].status === "fulfilled" &&
                                    item.capa.getLayers().length > 0
                                )
                                .map(item => item.capa)
                        );

                        if (grupo.getLayers().length > 0) {
                            mapa.fitBounds(grupo.getBounds(), {
                                padding: [25, 25],
                                maxZoom: 12
                            });
                        }
                    }

                    iniciarCapas().catch(console.error);
                </script>
